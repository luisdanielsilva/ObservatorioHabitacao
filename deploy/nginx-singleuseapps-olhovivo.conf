# OlhoVivo at https://www.singleuseapps.com/olhovivo (production build, run by PM2 as "olhovivo").
# Install: sudo cp deploy/nginx-singleuseapps-olhovivo.conf /etc/nginx/snippets/olhovivo.conf
# then add "include snippets/olhovivo.conf;" inside the www.singleuseapps.com server block
# (sites-available/singleuseapps-com), and run: sudo nginx -t && sudo systemctl reload nginx
#
# No trailing slash on proxy_pass: the app is built with basePath /olhovivo and expects it.
# "localhost", as the app listens on it: Next.js treats its own rewrites as another server when
# the addresses differ (127.0.0.1 vs localhost). Next.js sets the cache headers of its assets.

location /olhovivo {
    proxy_pass http://localhost:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDF reports with photos can take a few seconds; photo uploads are sent one by one.
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

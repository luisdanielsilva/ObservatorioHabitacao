# Nginx site for OlhoVivo. Replace the domain, then obtain the certificate with
#   sudo certbot --nginx -d olhovivo.pt -d www.olhovivo.pt
server {
    listen 80;
    listen [::]:80;
    server_name olhovivo.pt www.olhovivo.pt;

    # Next.js static assets are fingerprinted: cache them for a long time.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

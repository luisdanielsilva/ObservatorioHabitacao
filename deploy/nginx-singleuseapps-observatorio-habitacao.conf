# Observatório Habitação at https://www.singleuseapps.com/observatorio-habitacao (production build,
# run by PM2 as "observatorio-habitacao").
# Install: sudo cp deploy/nginx-singleuseapps-observatorio-habitacao.conf \
#   /etc/nginx/snippets/observatorio-habitacao.conf
# then add "include snippets/observatorio-habitacao.conf;" inside the www.singleuseapps.com
# server block (sites-available/singleuseapps-com), and run: sudo nginx -t && sudo systemctl reload nginx
#
# No trailing slash on proxy_pass: the app is built with basePath /observatorio-habitacao and
# expects it.
# "localhost", as the app listens on it: Next.js treats its own rewrites as another server when
# the addresses differ (127.0.0.1 vs localhost). Next.js sets the cache headers of its assets.

location /observatorio-habitacao {
    proxy_pass http://localhost:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDF reports with photos can take a few seconds; photo uploads are sent one by one.
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

# The preview's former path (before the rename from OlhoVivo): links already sent keep working.
location /olhovivo {
    rewrite ^/olhovivo(.*)$ /observatorio-habitacao$1 permanent;
}
